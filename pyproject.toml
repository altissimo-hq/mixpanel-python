[project]
name = "altissimo-mixpanel"
version = "0.1.0"
description = "Reusable Mixpanel analytics client for Altissimo projects"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [
    { name = "Altissimo HQ" },
]
keywords = ["mixpanel", "analytics", "altissimo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = []

[project.optional-dependencies]
mixpanel = ["mixpanel>=4.0"]

[project.urls]
Homepage = "https://github.com/altissimo-hq/mixpanel-python"
Repository = "https://github.com/altissimo-hq/mixpanel-python"
Issues = "https://github.com/altissimo-hq/mixpanel-python/issues"
Changelog = "https://github.com/altissimo-hq/mixpanel-python/blob/main/CHANGELOG.md"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "altissimo-mixpanel"
packages = [
    { include = "altissimo", from = "src" },
]

[tool.poetry.group.dev.dependencies]
mypy = ">=1.13"
pytest = ">=8.0"
pytest-cov = ">=6.0"
ruff = ">=0.11"
pre-commit = ">=4.0"

# Include mixpanel in dev for testing
mixpanel = ">=4.0"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "S",
    "SIM",
    "PT",
    "TCH",
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["altissimo"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "SLF001", "TC001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -v"

[tool.coverage.run]
source = ["altissimo"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
